<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CV — {{ page.title }}">
  <title>{{ page.title }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22256%22 height=%22256%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23bc412b%22></rect><text x=%2250%22 y=%2272%22 font-size=%2278%22 font-family=%22Avenir,Helvetica,sans-serif%22 font-weight=%22700%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>T</text></svg>">
  <link rel="stylesheet" href="media/{{ site.style }}-screen.css?v={{ site.time | date: '%s' }}" media="screen">
  <link rel="stylesheet" href="media/{{ site.style }}-print.css?v={{ site.time | date: '%s' }}">
</head>
<body>
  <main id="main">
    <article id="content">
      {{ content }}
    </article>
  </main>
  <script>
    // Restructure flat markdown output into sidebar + content row pairs
    (function() {
      var content = document.getElementById('content');
      if (!content) return;

      var children = Array.from(content.childNodes);
      var newHTML = '';
      var i = 0;

      // Collect header block (h1, subtitle p, #webaddress div)
      while (i < children.length) {
        var node = children[i];
        if (node.nodeType === 3) { i++; continue; } // skip text nodes
        var tag = node.tagName ? node.tagName.toLowerCase() : '';
        var id = node.id || '';

        if (tag === 'h1' || (tag === 'p' && node.previousElementSibling && node.previousElementSibling.tagName === 'H1') || id === 'webaddress') {
          newHTML += node.outerHTML;
          i++;
        } else {
          break;
        }
      }

      // Now process section blocks: h2 + everything until next h2
      while (i < children.length) {
        var node = children[i];
        if (node.nodeType === 3) { i++; continue; }
        var tag = node.tagName ? node.tagName.toLowerCase() : '';

        if (tag === 'h2') {
          var sidebarHTML = node.outerHTML;
          var bodyHTML = '';
          i++;
          while (i < children.length) {
            var next = children[i];
            if (next.nodeType === 3) { i++; continue; }
            var nextTag = next.tagName ? next.tagName.toLowerCase() : '';
            if (nextTag === 'h2') break;
            bodyHTML += next.outerHTML;
            i++;
          }
          newHTML += '<div class="cv-row"><div class="cv-label">' + sidebarHTML + '</div><div class="cv-body">' + bodyHTML + '</div></div>';
        } else {
          newHTML += node.outerHTML;
          i++;
        }
      }

      content.innerHTML = newHTML;
    })();
  </script>
</body>
</html>
