<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CV — {{ page.title }}">
  <title>{{ page.title }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22256%22 height=%22256%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23bc412b%22></rect><text x=%2250%22 y=%2272%22 font-size=%2278%22 font-family=%22Avenir,Helvetica,sans-serif%22 font-weight=%22700%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>T</text></svg>">
  <link rel="stylesheet" href="media/{{ site.style }}-screen.css?v={{ site.time | date: '%s' }}" media="screen">
  <link rel="stylesheet" href="media/{{ site.style }}-print.css?v={{ site.time | date: '%s' }}">
</head>
<body>
  <main id="main">
    <article id="content">
      {{ content }}
    </article>
  </main>

  <script>
    // ── Theme management ──────────────────────────────────────────────────────
    var LIGHT_STREAK  = 'https://streak-stats.demolab.com/?user=noobskies&hide_border=true&background=FFFFFF&ring=bc412b&fire=bc412b&currStreakLabel=bc412b&sideLabels=555555&dates=888888&stroke=e0e0e0';
    var DARK_STREAK   = 'https://streak-stats.demolab.com/?user=noobskies&hide_border=true&background=1a1a1a&ring=e8705a&fire=e8705a&currStreakLabel=e8705a&sideLabels=aaaaaa&dates=666666&stroke=333333';
    var LIGHT_SUMMARY = 'https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=noobskies&theme=github';
    var DARK_SUMMARY  = 'https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=noobskies&theme=github_dark';

    function getStoredTheme() { return localStorage.getItem('theme'); }
    function setStoredTheme(t) { localStorage.setItem('theme', t); }

    function isDark() {
      var stored = getStoredTheme();
      if (stored) return stored === 'dark';
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var streak  = document.getElementById('gh-streak');
      var summary = document.getElementById('gh-summary');
      if (streak)  streak.src  = dark ? DARK_STREAK  : LIGHT_STREAK;
      if (summary) summary.src = dark ? DARK_SUMMARY : LIGHT_SUMMARY;
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = dark ? '☀ Light' : '☾ Dark';
    }

    function toggleTheme() {
      var dark = !isDark();
      setStoredTheme(dark ? 'dark' : 'light');
      applyTheme(dark);
    }

    // Apply on load
    applyTheme(isDark());

    // Listen for OS-level changes (only if user hasn't overridden)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!getStoredTheme()) applyTheme(e.matches);
    });

    // ── DOM restructuring: wrap h2 sections into sidebar+body rows ───────────
    (function() {
      var content = document.getElementById('content');
      if (!content) return;
      var children = Array.from(content.childNodes);
      var newHTML = '';
      var i = 0;

      // Collect header block (h1, subtitle p, #webaddress div)
      while (i < children.length) {
        var node = children[i];
        if (node.nodeType === 3) { i++; continue; }
        var tag = node.tagName ? node.tagName.toLowerCase() : '';
        var id  = node.id || '';
        if (tag === 'h1' || id === 'webaddress' || (tag === 'p' && node.previousElementSibling && node.previousElementSibling.tagName === 'H1')) {
          newHTML += node.outerHTML; i++;
        } else { break; }
      }

      // Section rows: each h2 + content until next h2
      while (i < children.length) {
        var node = children[i];
        if (node.nodeType === 3) { i++; continue; }
        var tag = node.tagName ? node.tagName.toLowerCase() : '';
        if (tag === 'h2') {
          var labelHTML = node.outerHTML;
          var bodyHTML  = '';
          i++;
          while (i < children.length) {
            var next = children[i];
            if (next.nodeType === 3) { i++; continue; }
            if (next.tagName && next.tagName.toLowerCase() === 'h2') break;
            bodyHTML += next.outerHTML;
            i++;
          }
          newHTML += '<div class="cv-row"><div class="cv-label">' + labelHTML + '</div><div class="cv-body">' + bodyHTML + '</div></div>';
        } else {
          newHTML += node.outerHTML; i++;
        }
      }

      content.innerHTML = newHTML;

      // Re-apply theme after DOM restructure (img#gh-streak etc. are now live)
      applyTheme(isDark());

      // Inject theme toggle button
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.textContent = isDark() ? '☀ Light' : '☾ Dark';
      btn.onclick = toggleTheme;
      document.getElementById('main').appendChild(btn);
    })();
  </script>
</body>
</html>
